<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login – SGDI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f4f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { width: 100%; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .card-header { background: #212529; color: #fff; text-align: center; font-size: 1.4rem; font-weight: 700; border-radius: 10px 10px 0 0; padding: 1.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">SGDI – Login</div>
    <div class="card-body p-4">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Entrar</button>
      </form>

      <hr>
      <p class="text-center mb-0 small">
        Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a>
      </p>
    </div>
  </div>
</body>
</html>
